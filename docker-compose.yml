# version: "3.9"

services:

  postgres:
    image: postgres:17
    # container_name: postgres-db

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookingapp

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

  backend:

    build:
      context: ./backend/demo

    container_name: booking-backend

    ports:
      - "8080:8080"

    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookingapp
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password

    restart: unless-stopped

  frontend:

    build:
      context: ./frontend/ticket-booking

    container_name: booking-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend
    environment:
          - NEXT_PUBLIC_API_URL=http://localhost:8080

    restart: unless-stopped

volumes:

  postgres-data: